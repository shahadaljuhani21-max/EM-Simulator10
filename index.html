<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EM Clinical Simulator</title><style>:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Arial;color:#e8eef9;background:#0b1220}*{box-sizing:border-box}body{margin:0}button,input,textarea,select{font:inherit}button{cursor:pointer;border:0}a{color:#91b8ff}.layout{display:grid;grid-template-columns:246px minmax(0,1fr);min-height:100vh}.sidebar{background:#101b31;border-right:1px solid #293650;padding:26px 18px;display:flex;flex-direction:column;gap:20px}.brand{font-weight:800;font-size:20px;letter-spacing:-.5px}.brand small{display:block;color:#95a9c8;font-size:11px;font-weight:500;letter-spacing:1.5px;margin-top:5px}.nav{display:grid;gap:7px}.nav button{text-align:left;background:transparent;color:#b8c8e1;padding:12px;border-radius:10px}.nav button.active,.nav button:hover{background:#23395b;color:white}.tag{font-size:11px;color:#9cb1ce;line-height:1.5}.main{padding:34px clamp(18px,5vw,68px);max-width:1300px;width:100%;margin:auto}.eyebrow{color:#82b6ff;text-transform:uppercase;font-weight:700;font-size:11px;letter-spacing:2px}.title{font-size:clamp(27px,4vw,43px);letter-spacing:-1.3px;margin:10px 0}.lead{color:#9fb0c9;line-height:1.7;max-width:750px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin:26px 0}.card,.panel{background:#152239;border:1px solid #2a3b55;border-radius:17px;padding:23px}.card h3{margin:12px 0 8px}.card p,.muted{color:#a9b9d1;line-height:1.6}.pill{display:inline-flex;padding:5px 10px;border-radius:50px;background:#243957;color:#b9d8ff;font-size:12px}.primary{background:#4e91f8;color:#061328;font-weight:800;padding:12px 18px;border-radius:10px}.secondary{background:#283a54;color:#eaf2ff;padding:12px 18px;border-radius:10px}.danger{background:#502b37;color:#ffc6d0}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}.row{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap}.vitals{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:20px 0}.vital{background:#20324d;border-radius:11px;padding:13px;font-size:13px;color:#e3ecf9}.input{width:100%;border:1px solid #3a4e6a;background:#0e1a2e;color:white;border-radius:12px;padding:15px;min-height:125px;resize:vertical;line-height:1.5}.input:focus{outline:2px solid #5d9afa}.feedback{border-left:4px solid #86b3f5;background:#1b2d47;padding:17px;border-radius:9px;margin-top:18px;line-height:1.6}.feedback.optimal{border-color:#52c99a}.feedback.acceptable{border-color:#f1cc78}.feedback.incorrect,.feedback.unnecessary{border-color:#e9a15b}.feedback.dangerous{border-color:#ef6b80}.feedback.unknown{border-color:#9bacc4}.choices{display:grid;gap:9px;margin-top:18px}.choice{display:block;width:100%;text-align:left;background:#223652;border:1px solid #38516f;color:#f2f6ff;border-radius:10px;padding:13px}.choice:hover{border-color:#79adf6}.section{margin:26px 0}.tiny{font-size:12px;color:#93a7c3}.progress{height:7px;background:#2a3c57;border-radius:20px;overflow:hidden;margin:18px 0}.progress div{height:100%;background:#5a9cff}.reference{font-size:13px;color:#9eb1cf}.status{font-weight:700}.history{max-height:240px;overflow:auto}.history div{padding:9px 0;border-bottom:1px solid #2c3b51}.wide{max-width:850px}.foot{margin-top:auto;border-top:1px solid #31435d;padding-top:18px}.toast{padding:12px 15px;background:#1c3e3a;color:#d4ffec;border-radius:10px;margin-top:14px}.alert{padding:13px 16px;background:#3b2d2c;color:#ffe1c6;border-radius:10px}.code{background:#0c1729;padding:16px;border-radius:12px;overflow:auto;color:#c7dbf8;font-size:12px;max-height:270px;white-space:pre-wrap}.mode{display:flex;gap:9px;flex-wrap:wrap;margin:15px 0}.mode button{background:#273a55;color:#d4e3f9;padding:10px 15px;border-radius:10px}.mode button.active{background:#5599ff;color:#07192f;font-weight:800}.hidden{display:none}.stat{font-size:27px;font-weight:800}.hint{background:#253752;border-radius:10px;padding:12px;color:#c8d9f4}.spacer{height:12px}@media(max-width:850px){.layout{grid-template-columns:1fr}.sidebar{padding:15px;gap:9px}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap}.foot{display:none}.main{padding:24px 16px}.grid{grid-template-columns:1fr}.card,.panel{padding:17px}}
</style></head><body><div id="app"></div><script>const EM_BUNDLED_CASES={"schemaVersion":"2.0","packTitle":"Four Emergency Medicine Cases — Hidden Diagnoses","sourceStatus":"educational-draft-requires-clinician-review","cases":[{"id":"stemi","title":"Case 01 — Chest Discomfort","specialty":"Cardiology","presentation":"A 58-year-old man presents with 45 minutes of crushing central chest pain, diaphoresis and nausea. History: hypertension and smoking. He is awake, pale and uncomfortable.","objectives":["Recognize ACS and assess stability","Obtain and interpret a 12-lead ECG rapidly","Initiate appropriate monitored care and reperfusion pathway","Recognize contraindications and reassess"],"references":[{"title":"2025 ACC/AHA/ACEP/NAEMSP/SCAI Guideline for Management of Patients With Acute Coronary Syndromes","url":"https://professional.heart.org/","note":"Verify local STEMI pathway and current full guideline before clinical use"}],"steps":[{"id":"initial","prompt":"The patient has just arrived. What are your immediate priorities?","vitals":"BP 112/74 · HR 104 · RR 20 · SpO₂ 97% · GCS 15","rules":[{"label":"Immediate assessment, monitor, IV access","category":"optimal","patterns":["abc","airway breathing circulation","vital","cardiac monitor","monitoring","iv access","intravenous access","assess stability"],"feedback":"Assess ABCs, stability, monitor and establish access.","flags":[]},{"label":"12-lead ECG immediately","category":"optimal","patterns":["12 lead ecg","12-lead ecg","electrocardiogram","obtain ecg","do ecg","ekg"],"feedback":"Acquire and interpret a 12-lead ECG promptly.","flags":[]},{"label":"Ask about symptoms, medications and contraindications","category":"acceptable","patterns":["history","medication","allerg","contraindication","onset"],"feedback":"Focused history helps management without delaying urgent ECG.","flags":[]},{"label":"Routine CT scan before ECG","category":"incorrect","patterns":["ct scan","ct chest","head ct"],"feedback":"A routine CT is not the priority for typical suspected ACS.","flags":[]},{"label":"Discharge without assessment","category":"dangerous","patterns":["discharge","send home","ignore"],"feedback":"Unsafe before evaluating potentially life-threatening chest pain.","flags":[]}],"critical":["ecg"],"updates":{"ecg":"ECG is now available: ST elevation in II, III, aVF with reciprocal ST depression in I and aVL."}},{"id":"ecg","prompt":"The ECG shows ST elevation in II, III, aVF and reciprocal depression in I and aVL. Interpret it and state your next priority.","vitals":"BP 108/70 · HR 102 · RR 20 · SpO₂ 97%","rules":[{"label":"Inferior STEMI; activate reperfusion pathway","category":"optimal","patterns":["inferior stemi","inferior myocardial infarction","st elevation myocardial infarction","activate cath","cath lab","primary pci","reperfusion","interventional cardiology"],"feedback":"Treat as STEMI and activate an appropriate rapid reperfusion pathway.","flags":[]},{"label":"Check right-sided leads if RV involvement suspected","category":"acceptable","patterns":["right sided","v4r","right ventricular","right lead"],"feedback":"Right ventricular involvement matters for hemodynamic management.","flags":[]},{"label":"Wait for troponin before activating cath lab","category":"dangerous","patterns":["wait troponin","wait for troponin","troponin before","delay pci"],"feedback":"A diagnostic STEMI ECG should not await troponin before reperfusion activation.","flags":[]},{"label":"Treat as simple reflux and discharge","category":"dangerous","patterns":["reflux","gastritis","discharge"],"feedback":"Incompatible with the diagnostic ECG.","flags":[]},{"label":"Repeat ECG and obtain serial ECGs","category":"acceptable","patterns":["repeat ecg","serial ecg"],"feedback":"Useful when clinically indicated, but should not delay reperfusion.","flags":[]}],"critical":["reperfusion"],"updates":{}},{"id":"management","prompt":"You have activated the STEMI pathway. What medical measures and safety checks are appropriate while arranging reperfusion?","vitals":"BP 104/68 · HR 98 · RR 19 · SpO₂ 97%","rules":[{"label":"Give chewable aspirin if no contraindication","category":"optimal","patterns":["aspirin","asa","acetylsalicylic"],"feedback":"Aspirin is a core initial antiplatelet measure when appropriate.","flags":[]},{"label":"Follow protocol for antithrombotics and urgent PCI","category":"optimal","patterns":["p2y12","heparin","anticoagul","antiplatelet","pci","reperfusion"],"feedback":"Use guideline- and local-pathway-directed antithrombotics and PCI.","flags":[]},{"label":"Evaluate nitrate contraindications","category":"acceptable","patterns":["nitrate contraindication","right ventricular","hypotension","pde5","sildenafil","v4r"],"feedback":"Avoid routine nitrates when hypotensive or RV infarction/PDE5 concerns exist.","flags":[]},{"label":"Routine oxygen despite normal saturation","category":"unnecessary","patterns":["oxygen","o2","nasal cannula"],"feedback":"Routine oxygen is not indicated solely for ACS when saturation is adequate and no hypoxemia.","flags":[]},{"label":"Give thrombolytic despite immediately available PCI without assessment","category":"incorrect","patterns":["thrombolytic","fibrinolytic","alteplase","tenecteplase"],"feedback":"Reperfusion selection depends on timely PCI availability, contraindications and protocol.","flags":[]},{"label":"Administer nitrates in hypotension or suspected RV infarction","category":"dangerous","patterns":["nitro despite hypotension","nitroglycerin despite","nitrate despite rv"],"feedback":"May precipitate severe hypotension.","flags":[]}],"critical":["aspirin","reperfusion"],"updates":{}},{"id":"reassess","prompt":"While awaiting transfer, the patient becomes dizzy and his BP falls. What now?","vitals":"BP 82/52 · HR 52 · RR 22 · SpO₂ 95%","rules":[{"label":"Reassess ABCs and perfusion immediately","category":"optimal","patterns":["reassess","abc","airway","perfusion","monitor","repeat vitals","blood pressure"],"feedback":"Urgent reassessment and hemodynamic support are needed.","flags":[]},{"label":"Assess for RV infarction and bradyarrhythmia","category":"optimal","patterns":["right ventricular","v4r","brady","av block","right sided"],"feedback":"Inferior STEMI can involve RV infarction and conduction abnormalities.","flags":[]},{"label":"Escalate to resuscitation team and expedite reperfusion","category":"optimal","patterns":["call senior","resuscitation","cath lab","urgent pci","reperfusion","cardiology"],"feedback":"Escalate instability and expedite definitive care.","flags":[]},{"label":"Continue nitrates despite hypotension","category":"dangerous","patterns":["continue nitrate","give nitrate","nitroglycerin","gt n"],"feedback":"Nitrates can worsen hypotension in this setting.","flags":[]},{"label":"Send home because pain improved","category":"dangerous","patterns":["discharge","send home"],"feedback":"Clinical instability requires urgent management.","flags":[]}],"critical":["reassess","reperfusion"],"updates":{}},{"id":"disposition","prompt":"After stabilization and urgent coronary intervention, what disposition and monitoring are appropriate?","vitals":"BP 110/72 · HR 78 · RR 18 · SpO₂ 97%","rules":[{"label":"Admit to monitored cardiac care","category":"optimal","patterns":["ccu","cardiac icu","coronary care","monitored","telemetry","admit"],"feedback":"Monitor for recurrent ischemia, arrhythmias and complications.","flags":[]},{"label":"Continue secondary prevention and follow-up","category":"acceptable","patterns":["secondary prevention","statin","antiplatelet","cardiac rehab","follow up"],"feedback":"Plan evidence-based secondary prevention and rehabilitation.","flags":[]},{"label":"Immediate discharge without observation","category":"dangerous","patterns":["discharge now","home immediately","no monitoring"],"feedback":"Post-STEMI monitoring and ongoing care are required.","flags":[]}],"critical":["admit"],"updates":{}}]},{"id":"asthma","title":"Case 02 — Difficulty Breathing","specialty":"Respiratory","presentation":"A 24-year-old woman with asthma arrives struggling to speak full sentences. She has used her rescue inhaler repeatedly with little benefit. No known cardiac disease.","objectives":["Assess severity and impending respiratory failure","Initiate inhaled bronchodilator and systemic steroid treatment","Monitor response and escalate appropriately","Avoid unsafe sedation and delayed reassessment"],"references":[{"title":"Global Initiative for Asthma (GINA) Strategy Report","url":"https://ginasthma.org/reports/","note":"Use latest available report and local acute asthma pathway"}],"steps":[{"id":"initial","prompt":"She is using accessory muscles and speaks only in phrases. What do you do immediately?","vitals":"BP 132/82 · HR 126 · RR 32 · SpO₂ 89% on room air","rules":[{"label":"ABCDE, severity assessment and monitoring","category":"optimal","patterns":["abc","assess severity","monitor","vitals","airway","breathing","respiratory effort"],"feedback":"Assess airway, breathing, work of breathing and mental status.","flags":[]},{"label":"Give controlled supplemental oxygen","category":"optimal","patterns":["oxygen","o2","supplemental oxygen"],"feedback":"Treat hypoxemia and titrate to the recommended target range.","flags":[]},{"label":"Inhaled short-acting beta agonist promptly","category":"optimal","patterns":["salbutamol","albuterol","saba","nebulized bronchodilator","nebuliser"],"feedback":"Rapid-acting inhaled bronchodilator therapy is essential.","flags":[]},{"label":"Systemic corticosteroid early","category":"optimal","patterns":["steroid","prednisolone","prednisone","hydrocortisone","methylprednisolone"],"feedback":"Early systemic corticosteroids reduce relapse and admission risk.","flags":[]},{"label":"Sedate to reduce anxiety","category":"dangerous","patterns":["sedat","benzodiazepine","diazepam","lorazepam"],"feedback":"Sedation can worsen respiratory compromise.","flags":[]},{"label":"Discharge immediately","category":"dangerous","patterns":["discharge","send home"],"feedback":"Severe hypoxemia and distress require urgent treatment.","flags":[]}],"critical":["oxygen","saba","steroid"],"updates":{}},{"id":"firstresponse","prompt":"After initial treatment, she remains tachypneic and hypoxemic. What next?","vitals":"BP 128/78 · HR 124 · RR 30 · SpO₂ 91% with oxygen","rules":[{"label":"Repeat bronchodilator and add inhaled ipratropium","category":"optimal","patterns":["repeat salbutamol","repeat albuterol","ipratropium","duoneb","repeat saba"],"feedback":"Repeated SABA plus ipratropium is appropriate in severe exacerbation.","flags":[]},{"label":"Consider IV magnesium sulfate in severe poor response","category":"acceptable","patterns":["magnesium","mgso4"],"feedback":"IV magnesium may be appropriate for severe attacks not responding to initial therapy.","flags":[]},{"label":"Reassess frequently and escalate","category":"optimal","patterns":["reassess","repeat vitals","senior","icu","respiratory","monitor"],"feedback":"Repeat assessments and early escalation are essential.","flags":[]},{"label":"Routine antibiotics without infection evidence","category":"unnecessary","patterns":["antibiotic","amoxicillin","ceftriaxone"],"feedback":"Antibiotics are not routine for uncomplicated asthma exacerbation.","flags":[]},{"label":"Delay treatment for chest X-ray","category":"incorrect","patterns":["wait xray","wait for xray","x ray first"],"feedback":"Do not delay treatment for nonessential imaging.","flags":[]}],"critical":["reassess"],"updates":{}},{"id":"deterioration","prompt":"She becomes drowsy and chest auscultation is now very quiet. What is your interpretation and response?","vitals":"BP 100/64 · HR 138 · RR 12 · SpO₂ 86% despite oxygen","rules":[{"label":"Recognize impending respiratory failure","category":"optimal","patterns":["impending respiratory failure","silent chest","exhaustion","life threatening","respiratory arrest"],"feedback":"Drowsiness, reduced effort and a quiet chest are danger signs.","flags":[]},{"label":"Call critical care and prepare airway support","category":"optimal","patterns":["intubat","airway","icu","anesthesia","critical care","ventilat","senior help"],"feedback":"Urgent experienced airway/critical-care support is needed.","flags":[]},{"label":"Continue monitored bronchodilator treatment","category":"acceptable","patterns":["salbutamol","albuterol","ipratropium","bronchodilator"],"feedback":"Continue indicated therapy while preparing escalation.","flags":[]},{"label":"Reassure and leave unmonitored","category":"dangerous","patterns":["leave alone","observe only","discharge","wait and see"],"feedback":"May progress to respiratory arrest.","flags":[]},{"label":"Give sedative without airway plan","category":"dangerous","patterns":["sedat","benzodiazepine","diazepam"],"feedback":"Can precipitate respiratory failure.","flags":[]}],"critical":["airway"],"updates":{}},{"id":"reassess","prompt":"Following appropriate advanced support, the patient improves. What do you reassess?","vitals":"BP 118/74 · HR 108 · RR 22 · SpO₂ 96% on support","rules":[{"label":"Reassess respiratory status and objective response","category":"optimal","patterns":["reassess","respiratory rate","spo2","oxygen saturation","work of breathing","peak flow","mental status"],"feedback":"Track oxygenation, ventilation, fatigue and response to therapy.","flags":[]},{"label":"Review need for ongoing monitoring and admission","category":"optimal","patterns":["admit","icu","monitor","observation","critical care"],"feedback":"A near-fatal episode requires monitored disposition.","flags":[]},{"label":"Discharge without review","category":"dangerous","patterns":["discharge immediately","send home now"],"feedback":"Inappropriate after impending respiratory failure.","flags":[]}],"critical":["reassess","admit"],"updates":{}}]},{"id":"arrest","title":"Case 03 — Sudden Collapse","specialty":"Resuscitation","presentation":"A 63-year-old patient collapses in the Emergency Department waiting area. He is unresponsive and has no normal breathing. Staff are at the bedside.","objectives":["Recognize arrest and start high-quality CPR","Identify shockable rhythm and defibrillate","Perform timed ACLS cycles and treat reversible causes","Recognize ROSC and begin post-arrest care"],"references":[{"title":"American Heart Association CPR & ECC Guidelines","url":"https://cpr.heart.org/en/resuscitation-science/cpr-and-ecc-guidelines","note":"Verify current adult cardiac arrest algorithm and local resuscitation policy"}],"steps":[{"id":"recognition","prompt":"The patient is unresponsive and not breathing normally. What are your first actions?","vitals":"Unresponsive · Agonal breathing · No definite pulse within 10 seconds","rules":[{"label":"Call for help and activate resuscitation","category":"optimal","patterns":["call for help","code blue","activate emergency","resuscitation team","crash team"],"feedback":"Activate the arrest response immediately.","flags":[]},{"label":"Start high-quality chest compressions","category":"optimal","patterns":["cpr","chest compressions","start compressions","high quality compressions"],"feedback":"Start CPR immediately and minimize interruptions.","flags":[]},{"label":"Attach defibrillator or AED","category":"optimal","patterns":["defibrillator","aed","attach pads","monitor rhythm"],"feedback":"Obtain rhythm analysis and prepare for defibrillation.","flags":[]},{"label":"Prolonged pulse check","category":"dangerous","patterns":["check pulse for 1 minute","prolonged pulse check","wait for pulse"],"feedback":"Do not delay CPR with prolonged pulse checks.","flags":[]},{"label":"CT scan before CPR","category":"dangerous","patterns":["ct scan","ct head"],"feedback":"Imaging must not delay life-saving resuscitation.","flags":[]}],"critical":["cpr","defib"],"updates":{}},{"id":"vf","prompt":"Monitor shows ventricular fibrillation (VF). What now?","vitals":"VF · Pulseless · CPR ongoing","rules":[{"label":"Deliver unsynchronized defibrillation","category":"optimal","patterns":["defibrillat","unsynchronized shock","shock vf","shock now","biphasic shock"],"feedback":"VF is shockable: defibrillate promptly with device-appropriate energy.","flags":[]},{"label":"Resume CPR immediately after shock","category":"optimal","patterns":["resume cpr","continue compressions","restart cpr","two minutes cpr"],"feedback":"Resume high-quality CPR immediately after shock.","flags":[]},{"label":"Synchronized cardioversion","category":"dangerous","patterns":["synchronized cardioversion","sync shock"],"feedback":"Synchronized cardioversion is not the treatment for pulseless VF.","flags":[]},{"label":"Atropine for VF","category":"incorrect","patterns":["atropine"],"feedback":"Atropine is not a treatment for VF arrest.","flags":[]},{"label":"Wait for IV access before first shock","category":"dangerous","patterns":["wait iv","iv before shock","wait for access"],"feedback":"Do not delay defibrillation for vascular access.","flags":[]}],"critical":["defib","cpr"],"updates":{}},{"id":"cycles","prompt":"After a shock, VF persists on the next rhythm check. Describe ongoing resuscitation.","vitals":"VF persists · Pulseless · CPR ongoing","rules":[{"label":"Continue two-minute CPR cycles and rhythm checks","category":"optimal","patterns":["cpr","compressions","2 min","two minute","rhythm check"],"feedback":"Maintain high-quality CPR with brief rhythm checks.","flags":[]},{"label":"Repeat defibrillation for persistent VF","category":"optimal","patterns":["defibrillat","shock","repeat shock"],"feedback":"Shock persistent VF according to ACLS algorithm.","flags":[]},{"label":"Epinephrine 1 mg IV/IO per ACLS timing","category":"optimal","patterns":["epinephrine","adrenaline","1 mg iv","1mg iv"],"feedback":"Adult cardiac arrest epinephrine is 1 mg IV/IO at guideline intervals; timing follows the shockable algorithm.","flags":[]},{"label":"Amiodarone for refractory VF per protocol","category":"acceptable","patterns":["amiodarone","lidocaine"],"feedback":"Consider antiarrhythmic therapy for refractory VF per ACLS algorithm.","flags":[]},{"label":"Search reversible causes","category":"acceptable","patterns":["h and t","reversible causes","hypoxia","potassium","tamponade","thrombosis"],"feedback":"Identify and treat reversible causes.","flags":[]},{"label":"Stop CPR for prolonged discussion","category":"dangerous","patterns":["stop cpr","pause compressions","long pause"],"feedback":"Prolonged CPR interruptions reduce perfusion.","flags":[]}],"critical":["cpr","defib"],"updates":{}},{"id":"rosc","prompt":"A pulse returns and the patient is breathing with assistance. What now?","vitals":"BP 94/58 · HR 112 sinus · SpO₂ 93% with assisted ventilation","rules":[{"label":"Confirm ROSC and reassess ABCDE","category":"optimal","patterns":["rosc","pulse","abc","reassess","airway","breathing"],"feedback":"Confirm circulation and stabilize airway, ventilation and perfusion.","flags":[]},{"label":"Post-arrest ECG and evaluate cause","category":"optimal","patterns":["12 lead ecg","ecg","coronary","cause","reversible"],"feedback":"Evaluate cause including acute coronary occlusion when suspected.","flags":[]},{"label":"Optimize oxygenation, ventilation and blood pressure","category":"optimal","patterns":["oxygen","ventilat","blood pressure","hemodynamic","vasopressor"],"feedback":"Avoid hypoxemia, hyperoxemia and hypotension through titrated care.","flags":[]},{"label":"Transfer to critical care","category":"optimal","patterns":["icu","critical care","intensive care","admit"],"feedback":"Ongoing post-arrest care needs monitored critical-care setting.","flags":[]},{"label":"Immediately discharge after ROSC","category":"dangerous","patterns":["discharge","send home"],"feedback":"Post-cardiac arrest care is essential.","flags":[]}],"critical":["rosc","icu"],"updates":{}}]},{"id":"undifferentiated-shock-04","title":"Case 04 — Fever and Confusion","specialty":"Emergency Medicine","presentation":"A 58-year-old man presents with 3 days of fever, productive cough and worsening dyspnea. His family reports new confusion for 2 hours. History: hypertension; no known drug allergies, recent hospitalization or known resistant organisms. T 39.2°C, HR 128, BP 82/48, RR 32, SpO₂ 88% on room air, GCS 13. Capillary refill 4 seconds; cool mottled extremities; right basal crackles and reduced air entry.","objectives":["Recognize shock and organ hypoperfusion without relying on a diagnostic label","Prioritize ABCDE, oxygenation and early resuscitation","Order targeted tests without delaying treatment","Administer timely empiric antimicrobials and reassess fluids","Initiate vasopressors for persistent hypotension and escalate to ICU","Recognize harmful delays and fluid overload"],"references":[{"title":"Surviving Sepsis Campaign International Guidelines 2021","url":"https://doi.org/10.1007/s00134-021-06506-y","note":"Guideline source; verify updates and local protocols before clinical teaching."},{"title":"NICE NG253: Suspected sepsis in people aged 16 or over","url":"https://www.nice.org.uk/guidance/ng253","note":"Use with local sepsis policy."},{"title":"ATS/IDSA Community-Acquired Pneumonia Guideline (2019)","url":"https://doi.org/10.1164/rccm.201908-1581ST","note":"Empiric CAP regimen must reflect local resistance and patient risk factors."}],"steps":[{"id":"arrival","prompt":"The patient is hypoxemic, hypotensive and confused. What are your immediate actions?","vitals":"T 39.2°C · HR 128 · BP 82/48 · RR 32 · SpO₂ 88% RA · GCS 13","critical":["airway","oxygen","shock"],"rules":[{"label":"ABCDE assessment and resuscitation activation","category":"optimal","patterns":["abcde","primary survey","assess airway breathing circulation","resuscitation","resus team","rapid response","call senior","senior help","critical care help"],"feedback":"Shock is a time-critical emergency. Evaluate airway protection, breathing, circulation and mental status while summoning help.","flags":[]},{"label": function stem(w){if(w.length<5)return w;return w.replace(/(ation|ations|ments|ment|ingly|ing|edly|ed|ies|es|s)$/,'').replace(/(iz|is)$/,'i')}
function wholeHas(n,p){const a=norm(n),b=norm(p);if(!b)return false;const boundary=(x)=>' '+x+' ';if(boundary(a).includes(boundary(b)))return true;const word=(w)=>w.replace(/(?:ing|ed|es|s)$/,'');const aw=a.split(' '),bw=b.split(' ');for(let i=0;i<=aw.length-bw.length;i++){if(bw.every((w,j)=>{let x=aw[i+j];return x===w||(w.length>=5&&x.length>=5&&word(x)===word(w))}))return true;}return false;}
function variants(p){let x=norm(p),v=[p];for(const [k,terms] of Object.entries(ALIASES)){if(x.includes(norm(k))||terms.some(t=>x===norm(t)))v.push(k,...terms)}return [...new Set(v)];}
function isNegated(text,term){const n=norm(text),p=norm(term);const at=(' '+n+' ').indexOf(' '+p+' ');if(at<0)return false;const before=n.slice(Math.max(0,at-95),at).split(/\b(?:and|then|but|however|instead|plus|also)\b|[.;]/).pop();return /\b(?:no|not|never|avoid|without|dont|do not|withhold|hold|stop|contraindicated|shouldnt|should not|must not)\b(?:\s+\w+){0,5}\s*$/.test(before);}
function classify(text,s){
 const n=norm(text);
 if(!n)return {category:'unknown',label:'Empty answer',feedback:'Enter a clinical action to continue.',matched:[]};
 const matches=[],negated=[];
 for(const r of s.rules){
  let positive=null,negative=null;
  for(const p of r.patterns)for(const q of variants(p)){
   if(wholeHas(n,q)){
    if(isNegated(text,q)||(/\b(?:do not|dont|never|avoid|without)\b/.test(n)&&!n.includes(norm(q))&&isNegated(text,p))){negative=q;continue}
    positive=q;break
   }
  }
  if(positive)matches.push({...r,term:positive});
  else if(negative)negated.push({...r,term:negative});
 }
 // If the student rejects a dangerous intervention, that is safer than proposing it.
 if(!matches.length&&negated.some(x=>x.category==='dangerous')){
  const r=negated.find(x=>x.category==='dangerous');
  return {category:'acceptable',label:'Avoided an unsafe action',feedback:'Appropriate safety awareness: '+r.feedback+' State the positive treatment you would provide next.',matched:[]};
 }
 // Negating an essential optimal action is unsafe even if the term is present.
 if(negated.some(x=>x.category==='optimal')&&!matches.some(x=>x.category==='dangerous')){
  const r=negated.find(x=>x.category==='optimal');
  return {category:'dangerous',label:'Withheld a priority action',feedback:'Withholding this priority intervention may delay necessary treatment. '+r.feedback,matched:[]};
 }
 if(!matches.length)return {category:'unknown',label:'Needs clarification',feedback:'I could not safely match this answer. Try a clearer clinical action or use a recognized synonym. Your answer has not been marked wrong. The simulator cannot judge every possible clinical phrase.',matched:[]};
 const rank={dangerous:5,incorrect:4,unnecessary:3,acceptable:2,optimal:1};
 matches.sort((a,b)=>rank[b.category]-rank[a.category]);
 const best=matches[0];
 const positives=matches.filter(x=>x.category==='optimal'||x.category==='acceptable');
 const issues=matches.filter(x=>rank[x.category]>=3);
 const explanation=[...new Set(matches.map(x=>(x.category.toUpperCase()+': '+x.label+'. '+x.feedback)))].join('\n');
 return {...best,label:issues.length?best.label:(positives.length>1?`${positives.length} relevant actions recognized`:best.label),
 feedback:explanation,matched:matches.map(x=>x.label)};
}
function submit(){if(locked)return;const s=selected.steps[idx],text=$('answer').value.trim(),result=classify(text,s);if(!text){$('feedbackBox').innerHTML='<div class="alert">Please enter an action.</div>';return}locked=true;last={...result,answer:text};logs.push({stage:idx+1,answer:text,category:result.category,label:result.label,feedback:result.feedback});renderFeedback(last)}
function renderFeedback(r){const s=selected.steps[idx];const next=idx===selected.steps.length-1?'Complete case →':'Continue to next clinical stage →';const detail=mode==='challenge'?'Detailed explanations will be included in the final debrief.':escapeHtml(r.feedback).replace(/\n/g,'<br>');const msg=r.category==='unknown'?'This answer needs clarification; revise it rather than accepting an inaccurate score.':detail;$('feedbackBox').innerHTML=`<div class="feedback ${escapeHtml(r.category)}"><strong>${escapeHtml(r.category.toUpperCase())}: ${escapeHtml(r.label)}</strong><p>${msg}</p>${mode!=='challenge'?`<div class="tiny"><strong>Clinical reasoning:</strong> ${r.category==='dangerous'?'This choice can delay lifesaving care or cause harm.':'Compare the action against the priority treatments below.'}<br><strong>Why / preferred approach:</strong> ${escapeHtml(s.rules.filter(x=>x.category==='optimal').map(x=>x.label+' — '+x.feedback).join(' | '))}</div>`:''}</div><div class="actions"><button class="primary" id="next">${next}</button><button class="secondary" id="retry">Try a different answer</button></div>`;$('next').onclick=()=>{idx++;locked=false;last=null;go(idx>=selected.steps.length?'results':'play')};if($('retry'))$('retry').onclick=()=>{locked=false;last=null;logs.pop();$('feedbackBox').innerHTML='';$('answer').disabled=false};$('answer').disabled=true}
function results(){const total=logs.length,optimal=logs.filter(l=>l.category==='optimal').length,acceptable=logs.filter(l=>l.category==='acceptable').length,danger=logs.filter(l=>l.category==='dangerous').length;const score=total?Math.max(0,Math.round((optimal+acceptable*.6-danger*.7)/total*100)):0;shell(`<div class="eyebrow">Case debrief</div><h1 class="title">${escapeHtml(selected.title)}</h1><p class="lead">This is a formative practice score, not a validated clinical competency assessment.</p><div class="grid"><div class="card"><div class="stat">${score}%</div><span class="muted">Practice score</span></div><div class="card"><div class="stat">${optimal}</div><span class="muted">Optimal decisions</span></div><div class="card"><div class="stat">${danger}</div><span class="muted">Unsafe decisions</span></div></div><div class="panel"><h3>Decision-by-decision review</h3>${logs.map((l,i)=>{const r=selected.steps[i].rules.find(x=>x.label===l.label);return `<div class="section"><strong>Stage ${i+1} · ${escapeHtml(l.category.toUpperCase())}</strong><p>${escapeHtml(l.answer)}</p><p class="muted">${escapeHtml(l.feedback||r?.feedback||'This action could not be reliably classified. Review the priority actions with your instructor.')}</p><p class="tiny">Expected priorities: ${escapeHtml(selected.steps[i].rules.filter(x=>x.category==='optimal').map(x=>x.label).join(' · '))}</p></div>`}).join('')}<h3>Sources to review</h3>${(selected.references||[]).map(r=>`<p class="reference"><a href="${escapeHtml(r.url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(r.title)}</a> — ${escapeHtml(r.note||'')}</p>`).join('')}<div class="actions"><button class="primary" id="restart">Replay case</button><button class="secondary" id="home">Case library</button></div></div>`);$('restart').onclick=()=>{idx=0;logs=[];locked=false;go('play')};$('home').onclick=()=>go('home')}
function guide(){shell(`<div class="eyebrow">User guide</div><h1 class="title">How the simulator works</h1><div class="panel wide"><h3>Guided</h3><p class="muted">Suggested decisions plus free-text input and immediate explanation.</p><h3>Independent</h3><p class="muted">Write your own decision, with an optional general hint.</p><h3>Challenge</h3><p class="muted">Write independently; explanations are deferred to the end-of-case debrief.</p><h3>Clinical decision recognition</h3><p class="muted">Offline deterministic phrase matching, medical synonym expansion, whole-phrase matching, negation screening and safety-first category priority. This is not a full medical-language AI: unsupported synonyms, complex negation and multiple-action answers can be misclassified. Review results with an instructor.</p><h3>Case packs</h3><p class="muted">Use AI Creator to download the exact template and prompt, then import one JSON file with multiple cases. Imported packs are saved locally in this browser and are not uploaded to a server.</p><div class="alert">Educational use only. Never use simulation advice for live patient care. Faculty must verify clinical pathways, doses, contraindications and citations.</div></div>`)}
const schema={schemaVersion:'2.0',packTitle:'My EM Case Pack',sourceStatus:'requires-clinician-review',cases:[{id:'unique-case-id',title:'Undifferentiated clinical presentation',specialty:'Emergency Medicine',presentation:'Fictional patient history, symptoms and context.',objectives:['Objective 1'],references:[{title:'Verified guideline title',url:'https://example.org/actual-source',note:'Section/page and date verified'}],steps:[{id:'stage-1',prompt:'What do you do next?',vitals:'BP 120/80 · HR 90 · RR 18 · SpO₂ 98%',critical:['required-action-key'],rules:[{label:'Appropriate intervention',category:'optimal',patterns:['accepted synonym','alternate phrase'],feedback:'Evidence-based explanation',flags:[]}],updates:{'required-action-key':'Result or reassessment'}}]}]};
const aiPrompt=`You are creating a medically rigorous EM Clinical Simulator CASE PACK compatible with a provided JSON template.\n\nBEFORE writing any cases, ask me for ALL of the following: (1) medical topic(s) and learning objectives (mandatory), (2) how many clinically distinct cases to generate (multiple cases per JSON file supported), (3) at least one identifiable medical source such as current official guideline, peer-reviewed reference, or uploaded teaching material (mandatory), and (4) whether I have lecture slides (optional). DO NOT generate cases until I provide the learning objectives and at least one source. If you cannot access or verify a source, say so; request its text/PDF or a verifiable alternative. Never fabricate references, page numbers, recommendations, or links.\n\nAsk me to upload the exact case-pack TEMPLATE and this prompt. Match its field names and schemaVersion exactly; return ONE downloadable .json file containing ALL cases in the cases[] array. Do not claim compatibility without validating the JSON structure.\n\nFor EACH case: fictional medically coherent patient, progressive stages, initial vitals, investigations revealed on request, action-dependent reassessment, disposition, debrief, and real references. For EACH decision: optimal, acceptable, unnecessary, incorrect, dangerous actions, many English synonyms and common abbreviations, explicit negative/contraindicated patterns, common errors, context/timing/dose/route checks and patient consequences. Do not assume all answers can be enumerated. Ensure answer recognition does not reward negated instructions. Avoid superficial variations of the same case. Guided, Independent, Challenge are PLAY MODES of each case; do not create three duplicated case records.\n\nIMPORTANT CURRENT IMPLEMENTATION LIMITATIONS: The attached offline simulator only supports the exact template's simple stage/rules fields and keyword classification. Complex branching, dose validation, full natural-language understanding and independent clinical verification are NOT implemented. Put essential safety notes in feedback; do not invent unsupported JSON fields expecting them to work. Mark the output as requiring clinician review.\n\nReturn only a valid UTF-8 JSON file plus a concise source-verification and limitations note outside the file.`;
function dl(name,content,type='application/json'){const blob=new Blob([content],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000)}
function creator(){shell(`<div class="eyebrow">Create & expand</div><h1 class="title">AI Case Pack Creator</h1><p class="lead">Give your preferred AI platform a prompt AND the exact JSON template. It must ask for objectives and at least one trustworthy medical source before writing cases. One file can contain multiple cases.</p><div class="panel wide"><h3>Step 1 — Get the instructions and template</h3><div class="actions"><button class="primary" id="copy">Copy AI prompt</button><button class="secondary" id="prompt">Download prompt (.txt)</button><button class="secondary" id="template">Download JSON template</button><button class="secondary" id="pack">Download sample 3-case pack</button></div><p class="tiny">Upload the downloaded JSON template alongside the prompt to ChatGPT, Claude, Gemini or another AI service.</p><h3>Step 2 — Ask the AI to generate your pack</h3><p class="muted">It should ask for learning objectives, case count and source documents first. AI output still needs medical review.</p><h3>Step 3 — Import the file</h3><div class="actions"><button class="primary" id="goto">Import Case Pack →</button></div><div id="copied"></div></div>`);$('copy').onclick=()=>navigator.clipboard.writeText(aiPrompt).then(()=>$('copied').innerHTML='<div class="toast">Prompt copied.</div>').catch(()=>$('copied').innerHTML='<div class="alert">Clipboard unavailable. Use Download prompt instead.</div>');$('prompt').onclick=()=>dl('EM_AI_Case_Pack_Prompt.txt',aiPrompt,'text/plain');$('template').onclick=()=>dl('EM_Case_Pack_Template_v2.json',JSON.stringify(schema,null,2));$('pack').onclick=()=>dl('EM_Three_Cases_Sample.json',JSON.stringify({schemaVersion:'2.0',packTitle:'Three EM cases',sourceStatus:'educational-draft-requires-clinician-review',cases:builtin},null,2));$('goto').onclick=()=>go('import')}
function validate(p){const errors=[];if(!p||typeof p!=='object'||p.schemaVersion!=='2.0'||!Array.isArray(p.cases))return ['Expected schemaVersion "2.0" and a cases[] array.'];if(!p.cases.length)errors.push('Case pack is empty.');if(p.cases.length>100)errors.push('Maximum 100 cases per file.');const ids=new Set();p.cases.forEach((c,i)=>{const x=`cases[${i}]`;for(const k of ['id','title','presentation'])if(typeof c[k]!=='string'||!c[k].trim())errors.push(`${x}.${k} must be nonempty text.`);if(ids.has(c.id)||builtin.some(b=>b.id===c.id)||imported.some(b=>b.id===c.id))errors.push(`${x}.id already exists. Use a unique id.`);ids.add(c.id);if(!Array.isArray(c.objectives)||!c.objectives.length)errors.push(`${x}.objectives required.`);if(!Array.isArray(c.references)||!c.references.length)errors.push(`${x}.references required.`);else c.references.forEach((r,j)=>{if(!r.title||!/^https?:\/\//.test(r.url||''))errors.push(`${x}.references[${j}] needs a title and http(s) URL.`)});if(!Array.isArray(c.steps)||!c.steps.length)errors.push(`${x}.steps required.`);else c.steps.forEach((s,j)=>{const y=`${x}.steps[${j}]`;if(!s.id||!s.prompt||!s.vitals)errors.push(`${y} needs id, prompt, vitals.`);if(!Array.isArray(s.rules)||!s.rules.length)errors.push(`${y}.rules required.`);else s.rules.forEach((r,k)=>{if(!r.label||!r.feedback||!['optimal','acceptable','unnecessary','incorrect','dangerous'].includes(r.category)||!Array.isArray(r.patterns)||!r.patterns.length||r.patterns.some(t=>typeof t!=='string'||!t.trim()))errors.push(`${y}.rules[${k}] invalid.`)})})});return errors}
function importPage(){shell(`<div class="eyebrow">Local case library</div><h1 class="title">Import Case Packs</h1><p class="lead">Upload one JSON file containing one or more cases. Files are validated before import. Case content stays in this browser.</p><div class="panel wide"><h3>Select JSON case pack</h3><input type="file" id="file" accept=".json,application/json"><div id="validation" class="section"></div><div class="actions"><button class="secondary" id="download">Download current imported cases</button><button class="danger secondary" id="clear">Remove imported cases</button></div><p class="tiny">${imported.length} imported case(s). Built-in cases cannot be deleted.</p></div>`);$('file').onchange=async e=>{const file=e.target.files[0];if(!file)return;let p;try{if(file.size>5e6)throw Error('File exceeds 5 MB.');p=JSON.parse(await file.text())}catch(err){$('validation').innerHTML=`<div class="alert">Unable to read JSON: ${escapeHtml(err.message)}</div>`;return}const errors=validate(p);if(errors.length){$('validation').innerHTML=`<div class="alert"><strong>Validation failed</strong><ul>${errors.slice(0,30).map(e=>`<li>${escapeHtml(e)}</li>`).join('')}</ul></div>`;return}window.pendingPack=p;$('validation').innerHTML=`<div class="toast"><strong>Structure valid — ${p.cases.length} case(s)</strong><p>${p.cases.map(c=>escapeHtml(c.title)).join(' · ')}</p><p>Warning: JSON validation does NOT verify medical accuracy, guideline currency or real source authenticity.</p><button class="primary" id="confirm">Import these cases</button></div>`;$('confirm').onclick=()=>{imported=[...imported,...window.pendingPack.cases];try{localStorage.setItem('em_imported_v2',JSON.stringify(imported));$('validation').innerHTML='<div class="toast">Cases imported successfully. Open Case Library to play.</div>'}catch{imported=imported.slice(0,-window.pendingPack.cases.length);$('validation').innerHTML='<div class="alert">Browser storage full. Reduce pack size.</div>'}}};$('download').onclick=()=>dl('my_em_cases.json',JSON.stringify({schemaVersion:'2.0',packTitle:'My Imported Cases',sourceStatus:'requires-clinician-review',cases:imported},null,2));$('clear').onclick=()=>{if(confirm('Remove all imported cases from this browser?')){imported=[];localStorage.removeItem('em_imported_v2');importPage()}}}
builtin=EM_BUNDLED_CASES.cases;go('home');
</script></body></html>
